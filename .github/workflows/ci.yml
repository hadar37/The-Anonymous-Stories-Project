

name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          cd server
          npm install

      - name: Run tests
        env:
          PORT: 5000
          JWT_SECRET: test_secret_key_for_ci
          MONGO_URI: mongodb://127.0.0.1:27017/test_db
        run: |
          cd server
          npm test